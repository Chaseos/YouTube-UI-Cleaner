<!DOCTYPE html>
<html>

<head>
  <title>YouTube UI Cleaner</title>

  <style>
    :root {
      --primary-color: #cc0000;
      /* Slightly darker red for dark mode */
      --primary-hover: #ff0000;
      --bg-color: #1f1f1f;
      --section-bg: #1f1f1f;
      --text-color: #e0e0e0;
      --text-secondary: #aaaaaa;
      --border-color: #333333;
      --toggle-bg-off: #3f3f3f;
      --toggle-on: #cc0000;
      --knob-color: #d0d0d0;
      --white: #ffffff;
      /* For header text */

      --border-radius: 8px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    }

    body {
      width: 360px;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
    }

    .container {
      max-height: 500px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--toggle-bg-off) var(--bg-color);
    }

    .container::-webkit-scrollbar {
      width: 8px;
    }

    .container::-webkit-scrollbar-thumb {
      background-color: var(--toggle-bg-off);
      border-radius: 4px;
    }

    .header {
      background-color: #202020;
      /* Dark header instead of bright red */
      border-bottom: 2px solid var(--primary-color);
      /* Red accent */
      color: var(--white);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }



    .section {
      padding: 10px 16px;
      /* Reduced padding from 12px 20px */
      border-bottom: 1px solid var(--border-color);
    }

    .section-content {
      padding-top: 8px;
      display: grid;
      gap: 8px;
      overflow: hidden;
    }

    /* Option styling */
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      cursor: pointer;
      /* Make whole row look clickable */
    }

    .option.sub-option {
      padding-left: 44px;
      opacity: 0.8;
    }

    .option.sub-option .option-title {
      font-size: 13px;
    }

    .option-content {
      flex: 1;
    }

    .option-title {
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-color);
    }

    .option-description {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* Consistent toggle switch styling */
    .toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--toggle-bg-off);
      transition: var(--transition);
      border-radius: 28px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--knob-color);
      transition: var(--transition);
      border-radius: 50%;
    }

    input:checked+.toggle-slider {
      background-color: var(--toggle-on);
    }

    input:checked+.toggle-slider:before {
      transform: translateX(16px);
      background-color: #fff;
    }

    /* Status message */
    .status {
      position: fixed;
      top: 16px;
      right: 16px;
      background-color: #2e7d32;
      color: white;
      padding: 10px 16px;
      border-radius: var(--border-radius);
      font-size: 14px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mt-4 {
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* Tabs styling */
    .tabs {
      display: flex;
      background-color: #202020;
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: var(--white);
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    /* Views */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* Custom Filters UI */
    .create-filter-btn {
      width: 100%;
      background: transparent;
      border: 2px dashed var(--border-color);
      color: var(--white);
      padding: 12px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .create-filter-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    
    .filter-title-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filter-summary {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    
    .filter-item.editing .filter-summary {
      display: none;
    }

    .filter-no-keywords {
      color: #ff5252;
    }
    
    .keyword-input-group {
      display: flex;
      gap: 8px;
    }

    .keyword-input-group input {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: var(--white);
      font-size: 14px;
    }

    .keyword-input-group input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .keyword-input-group button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      padding: 0 16px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .keyword-input-group button:hover {
      background-color: var(--primary-hover);
    }

    .filter-list {
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      background-color: #2a2a2a;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
      flex-shrink: 0;
    }

    .filter-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
    }

    .filter-body {
      display: none;
      padding: 12px;
      border-top: 1px solid var(--border-color);
      background-color: #242424;
    }

    .filter-item.editing .filter-body {
      display: block;
    }

    .filter-item.editing .filter-header {
      background-color: #2f2f2f;
    }

    .filter-title {
      flex: 1;
      font-size: 14px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-title-input {
      flex: 1;
      background-color: transparent;
      border: none;
      color: var(--white);
      font-size: 14px;
      border-bottom: 1px solid var(--primary-color);
      outline: none;
      display: none;
      padding: 2px 0;
    }

    .filter-item.editing .filter-title-container {
      display: none;
    }

    .filter-item.editing .filter-title-input {
      display: block;
    }

    .filter-keywords-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .keyword-chip {
      background-color: #333;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .keyword-chip button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    .keyword-chip button:hover {
      color: var(--primary-color);
    }

    .done-btn {
      margin-top: 12px;
      width: 100%;
      background-color: var(--toggle-bg-off);
      color: var(--white);
      border: none;
      border-radius: var(--border-radius);
      padding: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .done-btn:hover {
      background-color: #555;
    }

    .filter-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .icon-btn:hover {
      color: var(--primary-color);
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="icon.png" alt="Logo" width="24" height="24">
      YouTube UI Cleaner
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-target="view-general">General</button>
    <button class="tab-btn" data-target="view-custom">Custom Filters</button>
  </div>

  <div class="container">
    <div id="view-general" class="view active">
    <div class="section">
      <div class="section-content">
        <!-- Shorts Main Option -->
        <div class="option">
          <label class="toggle">
            <input type="checkbox" id="shorts">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Shorts</div>
          </div>
        </div>

        <!-- Shorts Sub-options -->
        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="shortsHome">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Home</div>
          </div>
        </div>

        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="shortsSubs">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Subscriptions</div>
          </div>
        </div>

        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="shortsSearch">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Search Results</div>
          </div>
        </div>

        <!-- Grouped Videos Option -->
        <div class="option mt-4">
          <label class="toggle">
            <input type="checkbox" id="grouped">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Grouped Videos</div>
          </div>
        </div>

        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="groupedMixes">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Mixes</div>
          </div>
        </div>

        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="groupedPodcasts">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Podcasts</div>
          </div>
        </div>

        <div class="option sub-option">
          <label class="toggle">
            <input type="checkbox" id="groupedPlaylists">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Playlists</div>
          </div>
        </div>

        <!-- Live Streams Option -->
        <div class="option mt-4">
          <label class="toggle">
            <input type="checkbox" id="hideLive">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Live Streams</div>
          </div>
        </div>

        <!-- Feed Pills Option -->
        <div class="option mt-4">
          <label class="toggle">
            <input type="checkbox" id="feedPills">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Home Feed Pills</div>
          </div>
        </div>

        <!-- Dismissable Sections Option -->
        <div class="option mt-4">
          <label class="toggle">
            <input type="checkbox" id="hideSections">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Dismissable Sections</div>
            <div class="option-description">Community posts, AI recs, etc.</div>
          </div>
        </div>

        <!-- Playables Option - HIDDEN FROM UI -->
        <div class="option hidden">
          <label class="toggle">
            <input type="checkbox" id="playables">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Playables</div>
            <div class="option-description">Removes Playables section</div>
          </div>
        </div>

        <!-- Paid Promotion Option -->
        <div class="option mt-4">
          <label class="toggle">
            <input type="checkbox" id="paidPromotion">
            <span class="toggle-slider"></span>
          </label>
          <div class="option-content">
            <div class="option-title">Hide Paid Promotion Banners</div>
          </div>
        </div>

      </div>
    </div>
    </div>

    <div id="view-custom" class="view">
      <div class="section">
        <div class="section-content">
          <button id="createGroupBtn" class="create-filter-btn">+ Create New Filter</button>

          <div id="filterList" class="filter-list mt-4">
            <!-- Filter items will be populated here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status" id="statusMessage">Settings saved successfully!</div>

  <script src="popup.js"></script>
</body>

</html>
